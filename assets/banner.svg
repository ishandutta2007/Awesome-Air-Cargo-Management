<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 52px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 500; fill: #93c5fd; }
    .badge { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #38bdf8; }
    
    @keyframes jetFlight {
      0% { transform: translate(-100px, 60px) scale(0.9); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.8; }
      100% { transform: translate(1250px, -60px) scale(1.1); opacity: 0; }
    }
    @keyframes pulseGrid {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.35; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    
    .jet-stream { animation: jetFlight 14s ease-in-out infinite; }
    .grid-lines { animation: pulseGrid 6s ease-in-out infinite; }
    .route-line { stroke-dasharray: 10 8; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg)" />

  <!-- Animated Background Grid -->
  <g class="grid-lines" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- World Map Decorative Nodes & Flight Paths -->
  <g opacity="0.3" stroke="#818cf8" stroke-width="2" fill="none">
    <path class="route-line" d="M 150 250 Q 450 80 750 220 T 1100 120" />
    <path class="route-line" d="M 100 180 Q 350 280 650 150 T 1050 260" />
    <circle cx="150" cy="250" r="5" fill="#38bdf8" />
    <circle cx="450" cy="135" r="5" fill="#38bdf8" />
    <circle cx="750" cy="220" r="5" fill="#818cf8" />
    <circle cx="1100" cy="120" r="5" fill="#c084fc" />
  </g>

  <!-- Dynamic Flying Aircraft Silhouette & Vapor Trail (Background Element) -->
  <g class="jet-stream" opacity="0.5">
    <path d="M 0 160 Q 200 140 400 150" stroke="url(#glow)" stroke-width="4" fill="none" />
    <path d="M 390 145 L 420 150 L 395 158 L 402 151 Z" fill="#38bdf8" />
  </g>

  <!-- Subtle Cargo Box Line Art Decorative Accents -->
  <g opacity="0.2" transform="translate(980, 50) scale(1.2)" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M 30 0 L 60 15 L 60 45 L 30 30 Z" />
    <path d="M 30 0 L 0 15 L 0 45 L 30 30 Z" />
    <path d="M 0 15 L 30 30 L 60 15" />
    <path d="M 30 30 L 30 60" fill="none" />
  </g>

  <!-- Main Foreground Content (Layered over background dynamic elements) -->
  <g filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect x="80" y="55" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="95" y="77" class="badge">✈️ AIR FREIGHT &amp; LOGISTICS TECH</text>

    <!-- Main Title -->
    <text x="80" y="150" class="title">Awesome Air Cargo Management</text>

    <!-- Subtitle -->
    <text x="80" y="195" class="subtitle">Curated SaaS Platforms, IATA ONE Record &amp; Open-Source Freight Ecosystem</text>

    <!-- Tech Tags / Highlights -->
    <g transform="translate(80, 240)">
      <rect x="0" y="0" width="140" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="16" y="21" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">📦 e-AWB / Messaging</text>

      <rect x="152" y="0" width="165" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="168" y="21" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🌐 IATA ONE Record</text>

      <rect x="329" y="0" width="155" height="32" rx="8" fill="#334155" opacity="0.8" />
      <text x="345" y="21" font-family="sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🛩️ Cargo Airline Systems</text>
    </g>
  </g>
</svg>
